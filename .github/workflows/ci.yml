name: Clinic CI

on:
  push:
    branches:
      - dev3
      - main
  pull_request:
    branches:
      - dev3
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E smoke tests
        run: |
          npm run start -- --hostname 127.0.0.1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:3000/login >/dev/null && break; sleep 1; done
          npx playwright test e2e/auth-and-navigation.spec.ts

      - name: Upload E2E report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-report
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore

  full-stack-e2e:
    name: Full-stack browser E2E
    runs-on: ubuntu-latest
    needs: [frontend, backend-unit, backend-integration]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Create CI environment file
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-local-password/' .env
          sed -i 's/^DATABASE_PASSWORD_DOCKER=.*/DATABASE_PASSWORD_DOCKER=ci-local-password/' .env
          # Keep the CI JWT fixture as valid standard Base64. Generating it inline
          # through sed can corrupt padding/special characters and prevent the
          # backend from starting before the browser tests even begin.
          sed -i 's#^APP_JWT_SECRET=.*#APP_JWT_SECRET=Gm3BtrgxmwVdnZiACjeuxzEZBQ4UZV2h45hD6XQhbZ4=#' .env
          sed -i 's/^BOOTSTRAP_ADMIN_EMAIL=.*/BOOTSTRAP_ADMIN_EMAIL=admin.e2e@example.com/' .env
          sed -i 's/^BOOTSTRAP_ADMIN_PASSWORD=.*/BOOTSTRAP_ADMIN_PASSWORD=AdminE2E!123456/' .env

      - name: Start PostgreSQL, backend and frontend
        run: docker compose up -d --build

      - name: Wait for services
        run: |
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null && \
              curl -fsS http://127.0.0.1:3000/login >/dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null
          curl -fsS http://127.0.0.1:3000/login >/dev/null

      - name: Seed a commission-eligible staff profile for E2E
        run: |
          docker compose exec -T postgres psql -U physiocare -d physiocare -v ON_ERROR_STOP=1 -c "
            INSERT INTO staff (name, name_en, position, phone, email, branch_ids, status, user_id)
            SELECT 'E2E Commission Owner', 'E2E Commission Owner', 'Physiotherapist', '0812345678', 'admin.e2e@example.com', '[1]', 'ACTIVE', u.id
            FROM users u
            WHERE u.email = 'admin.e2e@example.com'
              AND NOT EXISTS (SELECT 1 FROM staff s WHERE s.user_id = u.id);
          "

      - name: Run full-stack E2E flow
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          E2E_ADMIN_EMAIL: admin.e2e@example.com
          E2E_ADMIN_PASSWORD: AdminE2E!123456
        run: npx playwright test e2e/full-stack.spec.ts

      - name: Upload full-stack E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-e2e-report
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down -v

  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run all backend unit tests
        run: ./mvnw test -B

  backend-integration:
    name: Backend commission integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make test runner executable
        run: chmod +x mvnw run-commission-tests.sh

      - name: Run PostgreSQL integration tests
        run: ./run-commission-tests.sh

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [frontend, backend-unit, backend-integration]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build --pull
