name: Clinic CI

on:
  push:
    branches:
      - dev3
      - main
  pull_request:
    branches:
      - dev3
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E smoke tests
        run: |
          npm run start -- --hostname 127.0.0.1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:3000/login >/dev/null && break; sleep 1; done
          npm run e2e

      - name: Upload E2E report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-report
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore

  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run all backend unit tests
        run: ./mvnw test -B

  backend-integration:
    name: Backend commission integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make test runner executable
        run: chmod +x mvnw run-commission-tests.sh

      - name: Run PostgreSQL integration tests
        run: ./run-commission-tests.sh

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [frontend, backend-unit, backend-integration]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build --pull
