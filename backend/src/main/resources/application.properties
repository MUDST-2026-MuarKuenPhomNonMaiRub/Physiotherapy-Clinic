spring.application.name=physiocare-clinic-api
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/physiocare}
spring.datasource.username=${DATABASE_USERNAME:physiocare}
spring.datasource.password=${DATABASE_PASSWORD:physiocare}
# The clinic's local zone. Applied to the JVM (TimeZoneConfig) and to every
# database session, so LocalDate.now() and CURRENT_DATE agree on what day it is.
app.timezone=${APP_TIMEZONE:Asia/Bangkok}
spring.datasource.hikari.connection-init-sql=SET TIME ZONE '${APP_TIMEZONE:Asia/Bangkok}'
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.security.jwt.secret=${APP_JWT_SECRET}
app.security.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}
# The JWT lives in an HttpOnly cookie. Secure stays on unless a local http
# setup turns it off (APP_COOKIE_SECURE=false in the local .env).
app.security.cookie.name=${APP_COOKIE_NAME:physiocare_session}
app.security.cookie.secure=${APP_COOKIE_SECURE:true}
app.security.cookie.same-site=${APP_COOKIE_SAME_SITE:Strict}
app.security.pii-key=${APP_PII_KEY:}
app.auth.bootstrap-admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.auth.bootstrap-admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
# Google Calendar push (one-way, per physiotherapist). Leave the client id
# blank to keep the feature switched off; the screens then say so.
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/integrations/google/callback}
# Where the browser is sent back to after Google, and the base of the
# "open in LA BALANCE" link inside every calendar event.
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
