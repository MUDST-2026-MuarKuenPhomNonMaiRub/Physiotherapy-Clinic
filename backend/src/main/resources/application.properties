spring.application.name=physiocare-clinic-api
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/physiocare}
spring.datasource.username=${DATABASE_USERNAME:physiocare}
spring.datasource.password=${DATABASE_PASSWORD:physiocare}
# The clinic's local zone. Applied to the JVM (TimeZoneConfig) and to every
# database session, so LocalDate.now() and CURRENT_DATE agree on what day it is.
app.timezone=${APP_TIMEZONE:Asia/Bangkok}
spring.datasource.hikari.connection-init-sql=SET TIME ZONE '${APP_TIMEZONE:Asia/Bangkok}'
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.security.jwt.secret=${APP_JWT_SECRET}
app.security.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}
app.security.pii-key=${APP_PII_KEY:}
app.auth.bootstrap-admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.auth.bootstrap-admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
