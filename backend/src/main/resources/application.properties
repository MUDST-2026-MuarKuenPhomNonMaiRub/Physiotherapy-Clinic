spring.application.name=physiocare-clinic-api
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/physiocare}
spring.datasource.username=${DATABASE_USERNAME:physiocare}
spring.datasource.password=${DATABASE_PASSWORD:physiocare}
# Keep the pool bounded so a busy report/list screen cannot create an
# unbounded number of database connections. All values remain configurable
# for a larger deployment.
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}
# The clinic's local zone. Applied to the JVM (TimeZoneConfig) and to every
# database session, so LocalDate.now() and CURRENT_DATE agree on what day it is.
app.timezone=${APP_TIMEZONE:Asia/Bangkok}
spring.datasource.hikari.connection-init-sql=SET TIME ZONE '${APP_TIMEZONE:Asia/Bangkok}'
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.security.jwt.secret=${APP_JWT_SECRET}
app.security.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}
# The session cookie is Secure (HTTPS only) unless local development over plain http turns it off.
app.security.cookie.secure=${APP_COOKIE_SECURE:true}
app.security.pii-key=${APP_PII_KEY:}
app.auth.bootstrap-admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.auth.bootstrap-admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
# Google Calendar push (one-way, per physiotherapist). Leave the client id
# blank to keep the feature switched off; the screens then say so.
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/integrations/google/callback}
# Popup reminders on every calendar event, in minutes before it starts (at most five).
# Blank leaves reminders to each therapist's own Google default.
app.google.reminder-minutes=${GOOGLE_REMINDER_MINUTES:30,10}
# Where the browser is sent back to after Google, and the base of the
# "open in LA BALANCE" link inside every calendar event.
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# Outgoing email (password reset). Leave SMTP_HOST blank to switch email off;
# docker-compose points it at the local Mailpit inbox for development.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:LA BALANCE Clinic <no-reply@localhost>}
app.password-reset.token-ttl-minutes=${PASSWORD_RESET_TTL_MINUTES:30}
# An unreachable SMTP server must not mark the whole API unhealthy.
management.health.mail.enabled=false
